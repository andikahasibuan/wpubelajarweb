<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Artist Profile Page</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Hindia</h1>
      <div class="music-genre">
        <p>Indie, Alternative, Indonesian Pop</p>
      </div>
    </header>
    <main>
      <section class="profile-card">
        <figure class="artist-image">
          <img
            src="assets/images/Gemini_Generated_Image_qate24qate24qate.png"
            alt="Hindia"
          />
          <figcaption>
            <p>
              Hindia adalah musisi indie Indonesia yang menonjol dengan gaya
              musik yang unik dan menarik. Musiknya yang menggabungkan elemen
              indie dengan nu metal dan post-hardcore, membuatnya menjadi
              favorit di kalangan Gen Z. Dengan lirik yang puitis tapi mudah
              dimengerti, Hindia berhasil membuat musiknya menjadi lebih dari
              sekadar suara, tetapi juga pesan yang kuat. Musik ini telah
              membawa Hindia ke tingkat baru dalam industri musik Indonesia, dan
              telah menjadi musisi yang harus diperhatikan.
            </p>
          </figcaption>
        </figure>
      </section>
      <section class="stats">
        <div class="stats-item">
          <strong>2.5M</strong>
          <p>Spotify Followers</p>
        </div>
        <div class="stats-item">
          <strong>1.8M</strong>
          <p>Monthly Listeners</p>
        </div>
        <div class="stats-item">
          <strong>3</strong>
          <p>Official Full Albums</p>
        </div>
      </section>
      <section class="discograpy">
        <div class="album-list">
          <article class="album-card">
            <figure class="album-img">
              <img src="assets/images/rumah-kerumah.png" alt="rumah kerumah" />
              <figcaption>
                <h3>Rumah Ke Rumah (Full Album)</h3>
                <p><time datetime="2018">2018</time></p>
                <a href="#" class="btn-listen">Listen Now</a>
              </figcaption>
            </figure>
          </article>
          <article class="album-card">
            <figure class="album-img">
              <img
                src="assets/images/menari-dengan-bayangan.png"
                alt="menari dengan bayangan"
              />
              <figcaption>
                <h3>Menari dengan bayangan (Full Album)</h3>
                <p><time datetime="2020">2020</time></p>
                <a href="#" class="btn-listen">Listen Now</a>
              </figcaption>
            </figure>
          </article>
          <article class="album-card">
            <figure class="album-img">
              <img
                src="assets/images/besok-mungkin-kita-sampai.png"
                alt="besok mungkin kita sampai"
              />
              <figcaption>
                <h3>Besok Mungkin Kita Sampai (Full Album)</h3>
                <p><time datetime="2024">2024</time></p>
                <a href="#" class="btn-listen">Listen Now</a>
              </figcaption>
            </figure>
          </article>
        </div>
      </section>

      <nav class="social-links">
        <h3>Connect</h3>
        <a href="#" class="social-btn">Spotiy</a>
        <a href="#" class="social-btn">Apple Music</a>
        <a href="#" class="social-btn">Instagram</a>
        <a href="#" class="social-btn">Tiktok Artist</a>
      </nav>
    </main>
    <footer>
      <p>&copy; 2026 Hindia. All rights reserved</p>
      <p>Booking: <a href="mailto:booking@hindia.com">booking@hindia.com</a></p>
    </footer>
  </body>
</html>
