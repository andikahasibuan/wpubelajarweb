<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Belajar list</title>
  </head>
  <body>
    <!-- Emmet abbreviation -->
    <!-- ol>li{data $$}*5 -->
    <h2>Ordered List/ Daftar terurut</h2>
    <ol type="a">
      <li>data 01</li>
      <li>data 02</li>
      <li>data 03</li>
      <li>data 04</li>
      <li>data 05</li>
    </ol>

    <h2>Unordered List/ Daftar yang tidak berurut</h2>
    <ul type="Square">
      <li>data 01</li>
      <li>data 02</li>
      <li>data 03</li>
      <li>data 04</li>
      <li>data 05</li>
    </ul>

    <!-- dl>dt{HTML}dd{Hyper Text Markup Language}dt{CSS}dd{Cascanding Style Sheets} -->
    <h2>Description list/ Daftar deskripsi</h2>
    <dl>
      <dt>HTML</dt>
      <dd>Hyper Text Markup Language</dd>
      <dt>CSS</dt>
      <dd>Cascanding Style Sheets</dd>
    </dl>
  </body>
</html>
