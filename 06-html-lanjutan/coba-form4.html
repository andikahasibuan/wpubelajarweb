<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coba elemen form</title>
  </head>
  <body>
    <h1>Contoh elemen form didalam table</h1>

    <form action="">
      <table cellpadding="5">
        <tr>
          <td  align="right"><label for="nama" >
        Nama: </label</td>
          <td><input
          type="text"
          name="nama"
          id="nama"
          placeholder="masukkan nama"
        /></td>
        </tr>
        <tr>
          <td align="right"> <label for="password">
        Password:</td>
          <td><input type="password" name="password" id="password" /> </label
      ></td>
        </tr>
        <tr>
          <td align="right"><label for="email"
        >Email:</td>
          <td><input type="email" name="email" id="email" /> </label
      ></td>
        </tr>
        <tr>
          <td align="right"><label for="number">
        Nomor:
       </label
      ></td>
          <td> <input
          type="number"
          name="number"
          id="number"
          min="1"
          max="100"
          step="5"
        /> </td>
        </tr>
        <tr>
          <td align="right">  <label for="tanggal"
        >Tanggal:
        
      </label></td>
          <td><input type="date" name="tanggal" id="tanggal" value="tanggal" /></td>
        </tr>
        <tr>
          <td align="right"><label for="warna"
        >Pilih Warna:
         </label
      ></td>
          <td><input type="color" name="warna" id="warna" value="warna" /></td>
        </tr>
        <tr>
          <td></td>
          <td><button type="submit">Kirim</button></td>
        </tr>
      </table>
    </form>
  </body>
</html>
