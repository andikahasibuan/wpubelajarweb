<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contoh input atribut, checkbox & radio</title>
  </head>
  <body>
    <form>
      <h1>Contoh input atribut, checkbox & radio</h1>
      <label for="name">
        Nama:
        <input
          type="text"
          name="name"
          placeholder="Masukkan nama"
          autofocus
          autocomplete="off"
          required
        />
      </label>
      <br />

      <h3>Hobby</h3>
      <label for="hobby">
        <input
          type="checkbox"
          name="hobby"
          id="hobby"
          value="olahraga"
          checked
        />
      </label>
      Main bola
      <br />
      <label for="hobby2">
        <input type="checkbox" name="hobby2" id="hobby2" value="olahraga" />
      </label>
      Ngegym
      <br />

      <h3>Jenis Kelamin</h3>
      <label for="jenis_kelamin">
        <input
          type="radio"
          name="jenis_kelamin"
          id="pria"
          value="pria"
          checked
        />
        Pria
      </label>
      <label for="jenis_kelamin">
        <input type="radio" name="jenis_kelamin" id="wanita" value="wanita" />
        Wanita
      </label>
      <br />
      <button type="submit">Submit</button>
    </form>
  </body>
</html>
