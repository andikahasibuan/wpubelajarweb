<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Marging table</title>
  </head>
  <body>
    <table border="1" cellpadding="5" cellspacing="0">
      <tr>
        <td>1,1</td>
        <td>1,2</td>
        <td rowspan="3">rowspan 3</td>
      </tr>
      <tr>
        <td>2,1</td>
        <td>2,2</td>
      </tr>
      <tr>
        <td colspan="2">colspan = 3</td>
      </tr>
    </table>
  </body>
</html>
