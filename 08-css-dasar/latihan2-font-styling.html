<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fase Runtuh</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@100..900&display=swap");

      h1 {
        font-size: 50px;
        font-family: "Roboto Slab", "Times New roman", serif;
        font-weight: bold;
        font-style: italic;
        text-transform: uppercase;
        text-align: center;
        letter-spacing: 12px;
        word-spacing: 20px;
        text-decoration: underline;
        text-decoration-style: wavy;
        text-decoration-color: grey;
        text-decoration-thickness: 5px;
        text-shadow: 5px 5px 5px grey;
      }

      p {
        font-family: "Roboto Slab", "Times New Roman", serif;
        font-size: 36px;
        line-height: 80px;
        text-align: center;
        word-spacing: 15px;
      }

      .span1 {
        text-decoration: line-through;
        color: grey;
      }

      .penulis1 {
        font-size: 25px;
        color: grey;
      }
    </style>
  </head>
  <body>
    <h1>Fase Runtuh</h1>
    <p>
      "Tak perlu khawatir, ku hanya
      <span class="span1">terluka</span>. terbiasa tuk pura-pura tertawa. Namun
      bolehkah sekali saja ku menangis? Sebelum kembali membohongi diri."
    </p>

    <p class="penulis1">- feby putri feat. fiersa besari</p>
  </body>
</html>
