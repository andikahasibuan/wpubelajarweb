<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fase Runtuh</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@100..900&display=swap");

      body {
        background-image:
          linear-gradient(to bottom, rgb(0 0 0/70%), rgb(0 0 0/40%)),
          url(images/gambar3.jpg);
        font-family: "Roboto Slab", "Times New roman", serif;
        background-size: cover;
        text-align: center;
        background-repeat: no-repeat;
        background-attachment: fixed;
        background-position: center;
        min-height: 100vh;
      }

      h1 {
        color: transparent;
        font-weight: bold;
        font-size: 48px;
        font-style: italic;
        text-transform: uppercase;
        letter-spacing: 12px;
        word-spacing: 20px;
        background-image: linear-gradient(
          to right,
          rgb(99, 99, 167),
          rgb(18, 208, 145)
        );
        background-clip: text;
        filter: drop-shadow(0 0 10px rgb(88, 129, 143));
      }

      .quote {
        color: white;
        font-family: "Roboto Slab", "Times New Roman", serif;
        font-size: 22px;
        /* 22 X 2  */
        line-height: 2;
        word-spacing: 15px;
        background-color: rgb(0 0 0/30%);
        border-radius: 40px;
        max-width: 700px;
        height: 150px;
        margin: auto;
        padding: 30px;
        border: 1px solid rgb(255 255 255 / 30%);
        box-shadow: 0 0 30px rgb(0 0 0 / 50%);
      }

      .span1 {
        color: rgb(255, 5, 55);
        text-shadow: 0 0 10px rgb(220, 20, 60);
      }

      .penulis1 {
        font-size: 25px;
        letter-spacing: 2px;
        color: rgb(185, 178, 178);
        text-transform: uppercase;
        border-top: 1px solid rgb(255 255 255 / 20%);
        width: 30%;
        margin: 5% auto;
        padding-top: 10px;
      }

      p {
        margin: 0;
      }
    </style>
  </head>
  <body>
    <h1 class="title">Fase Runtuh</h1>
    <p class="quote">
      "Tak perlu khawatir, ku hanya
      <span class="span1">terluka</span>. <br />
      terbiasa tuk pura-pura. <tertawa class="br"></tertawa>Namun bolehkah
      sekali saja ku menangis? Sebelum kembali membohongi diri."
    </p>
    <p class="penulis1">- feby putri feat. fiersa besari</p>
  </body>
</html>
