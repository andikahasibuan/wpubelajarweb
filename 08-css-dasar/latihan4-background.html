<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fase Runtuh</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@100..900&display=swap");

      body {
        background-image: url(images/gambar3.jpg);
        font-family: "Roboto Slab", "Times New roman", serif;
        text-align: center;
        background-size: cover;
        background-repeat: no-repeat;
        min-height: 100vh;
      }

      h1 {
        color: rgb(36, 168, 211);
        font-weight: bold;
        font-size: 48px;
        font-style: italic;
        text-transform: uppercase;
        letter-spacing: 12px;
        word-spacing: 20px;
        text-shadow: 5px 5px 4px rgb(52, 50, 50);
      }

      .quote {
        color: white;
        font-family: "Roboto Slab", "Times New Roman", serif;
        font-size: 22px;
        /* 22 X 2  */
        line-height: 2;
        word-spacing: 15px;
      }

      .kotak {
        height: 200px;
        width: 700px;
        border: 3px solid rgba(77, 55, 55, 0.5);
        border-radius: 40px;
        margin: auto;
        background-color: rgb(0 0 0/ 50%);
      }

      .span1 {
        color: rgb(255, 5, 55);
        text-decoration: line-through;
        text-decoration-thickness: 2px;
      }

      .penulis1 {
        font-size: 25px;
        color: rgb(73, 68, 68);
        letter-spacing: 2px;
      }
      p {
        margin: 0;
      }
    </style>
  </head>
  <body>
    <h1 class="title">Fase Runtuh</h1>
    <div class="kotak">
      <p class="quote">
        "Tak perlu khawatir, ku hanya
        <span class="span1">terluka</span>. <br />
        terbiasa tuk pura-pura <tertawa class="br"></tertawa>Namun bolehkah
        sekali saja ku menangis? Sebelum kembali membohongi diri."
      </p>
    </div>
    <p class="penulis1">- feby putri feat. fiersa besari</p>
  </body>
</html>
