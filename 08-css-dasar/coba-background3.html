<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coba Background</title>
    <style>
      body {
        background-color: cornflowerblue;
        background-image: linear-gradient(to top, blue, red);
        height: 100vh;
      }
      .kotak1 {
        height: 200px;
        width: 200px;
        background-color: lightblue;
        background-image: linear-gradient(green, lightblue);
      }
      .kotak2 {
        height: 200px;
        width: 200px;
        background-color: green;
        background-image: radial-gradient(brown, blue);
      }
      .kotak3 {
        height: 200px;
        width: 200px;
        background-color: lightblue;
        background-image: conic-gradient(black, brown);
      }
    </style>
  </head>
  <body>
    <div class="kotak1"></div>
    <div class="kotak2"></div>
    <div class="kotak3"></div>
  </body>
</html>
